[project]
name = "intelliknow"
version = "0.1.0"
description = "IntelliKnow KMS — RAG-based knowledge management system"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.121.0",
    "jsonschema>=4.26.0",
    "openai>=2.53.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pydantic>=2.7",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "reportlab>=5.0.0",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
