[project]
name = "intelliknow"
version = "0.1.0"
description = "IntelliKnow KMS — RAG-based knowledge management system"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
