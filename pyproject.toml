[project]
name = "intelliknow"
version = "0.1.0"
description = "IntelliKnow KMS — RAG-based knowledge management system"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "anthropic>=0.121.0",
    "botbuilder-core>=4.17.1",
    "cryptography>=50.0.0",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "httpx[socks]>=0.28.1",
    "jsonschema>=4.26.0",
    "openai>=2.53.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pydantic>=2.7",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "reportlab>=5.0.0",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.61.1",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# A bare `uv run pytest` (no `-m`) would otherwise collect and run the
# `slow` tests too, which load a real sentence-transformers/torch model in
# a process that has already initialized faiss's OpenMP runtime (via
# earlier VectorStore-backed tests) -- on this platform that combination
# aborts the interpreter outright (`Fatal Python error: Aborted`, not a
# catchable exception), not merely fails a test. Defaulting to `not slow`
# here makes the bare command the safe one; `uv run pytest -m slow` (or any
# explicit `-m` override) still opts back in deliberately.
addopts = "-m \"not slow\""
markers = [
    "slow: loads a real model or hits real infra (see superpowers/test-plans/04-rag-read-path-tests.md L2); excluded by `-m \"not slow\"`.",
]
